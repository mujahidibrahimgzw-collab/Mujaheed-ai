<!DOCTYPE html>
<html lang="ha">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mujaheed AI</title>
<style>
body{font-family:sans-serif;background:#0f0f0f;color:white;margin:0;display:flex;flex-direction:column;height:100vh}
.header{background:#1a1a1a;padding:15px;text-align:center;border-bottom:1px solid #333}
.header h1{margin:0;color:#00ff88}
#chat{flex:1;overflow-y:auto;padding:20px}
.msg{margin:10px 0;padding:12px 15px;border-radius:15px;max-width:80%}
.user{background:#00ff88;color:black;margin-left:auto}
.ai{background:#2a2a2a}
.input-area{display:flex;padding:15px;background:#1a1a1a;gap:10px}
input{flex:1;padding:12px;border-radius:25px;border:none;background:#333;color:white;outline:none}
button{padding:12px 25px;border-radius:25px;border:none;background:#00ff88;font-weight:bold;cursor:pointer}
</style>
</head>
<body>
<div class="header"><h1>🤖 Mujaheed AI</h1><small>Tambayi komai a Hausa ko Turanci</small></div>
<div id="chat"><div class="msg ai">Sannu! Ni ne Mujaheed AI. Me zan taimaka maka?</div></div>
<div class="input-area">
<input id="input" placeholder="Rubuta tambayarka..." onkeypress="if(event.key==='Enter')send()">
<button onclick="send()">Aika</button>
</div>
<script>
const chat=document.getElementById('chat');
const inp=document.getElementById('input');
const API_URL = window.location.origin;

async function send(){
 const text=inp.value.trim();
 if(!text)return;
 chat.innerHTML+=`<div class="msg user">${text}</div>`;
 inp.value='';
 chat.scrollTop=chat.scrollHeight;
 try{
  const res=await fetch(API_URL+'/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text})});
  const data=await res.json();
  chat.innerHTML+=`<div class="msg ai">${data.reply||data.error}</div>`;
 }catch(e){
  chat.innerHTML+=`<div class="msg ai">Kuskure: ${e.message}</div>`;
 }
 chat.scrollTop=chat.scrollHeight;
}
</script>
</body>
</html>
